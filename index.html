<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Score Keeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tennis Score</h1>

        <div class="match-score">
            <span id="games1">0</span> - <span id="games2">0</span>
            <div class="match-label">Games</div>
        </div>

        <div class="scoreboard">
            <div class="team team1">
                <h2>Team 1</h2>
                <div class="score" id="score1">0</div>
                <button onclick="scorePoint(1)">Point</button>
            </div>

            <div class="vs">vs</div>

            <div class="team team2">
                <h2>Team 2</h2>
                <div class="score" id="score2">0</div>
                <button onclick="scorePoint(2)">Point</button>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="voice-status" id="voiceStatus">Voice: Off</div>

        <div class="controls">
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">Start Voice</button>
            <button class="reset-btn" onclick="resetGame()">New Game</button>
            <button class="reset-btn" onclick="resetMatch()">New Match</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
